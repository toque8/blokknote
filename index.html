<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Blokknote</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      background: #f9f9f7;
      color: black;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    .top-bar {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .pencil-icon {
      height: 53px;
      opacity: 0.8;
    }
    .format-tools, .lang-switch {
      font-size: 16px;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .format-tools span, .lang-switch span {
      cursor: pointer;
      opacity: 0.7;
      user-select: none;
    }
    .format-tools span:hover, .lang-switch span:hover {
      opacity: 1;
    }
    .lang-switch span.active { opacity: 1; }

    /* Чёткое подчёркивание для g */
    .underline-hint {
      border-bottom: 2px solid currentColor;
      padding-bottom: 2px;
      display: inline-block;
    }

    #editor {
      flex: 1;
      padding: 24px;
      background: transparent;
      color: black;
      border: none;
      outline: none;
      font-size: 17px;
      line-height: 1.6;
      font-family: inherit;
      min-height: 200px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #editor:focus { outline: none; }
    #editor:empty::before {
      content: attr(data-placeholder);
      color: #999;
      opacity: 0.6;
    }

    .controls {
      padding: 18px 20px;
      display: flex;
      justify-content: center;
      gap: 44px;
      flex-shrink: 0;
    }
    .action-icon {
      height: 53px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s, transform 0.15s;
    }
    .action-icon:hover {
      opacity: 1;
      transform: scale(1.08);
    }

    @media (max-width: 500px) {
      .top-bar { padding: 14px 16px; }
      .pencil-icon { height: 44px; }
      .format-tools, .lang-switch { font-size: 15px; gap: 10px; }
      #editor { padding: 20px 16px; font-size: 16px; }
      .controls { padding: 16px; gap: 36px; }
      .action-icon { height: 44px; }
    }

    @media (max-width: 360px) {
      .top-bar { padding: 12px 12px; }
      .format-tools, .lang-switch { gap: 8px; }
      #editor { padding: 18px 12px; font-size: 15px; }
      .controls { gap: 32px; padding: 14px 12px; }
    }

    @supports (padding-top: env(safe-area-inset-top)) {
      .top-bar {
        padding-top: calc(16px + env(safe-area-inset-top));
      }
      .controls {
        padding-bottom: calc(18px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>

  <!-- Аудио -->
  <audio id="sound-typing" src="audio/typing.mp3" preload="auto"></audio>
  <audio id="sound-erase" src="audio/erase.mp3" preload="auto"></audio>
  <audio id="sound-download" src="audio/download.mp3" preload="auto"></audio>
  <audio id="sound-lang" src="audio/lang.mp3" preload="auto"></audio>

  <div class="top-bar">
    <img src="ui/pencil.png" class="pencil-icon" alt="" onerror="this.style.display='none'">
    
    <div class="format-tools">
      <span id="btn-bold"><b>e</b></span>
      <span id="btn-italic"><i>f</i></span>
      <span id="btn-underline" class="underline-hint">g</span>
      <span id="btn-heading">h3</span>
      <span id="btn-list">i-j-k</span>
    </div>
    
    <div class="lang-switch">
      <span id="lang-ru" class="active">RU</span>
      <span id="lang-en">EN</span>
    </div>
  </div>

  <div id="editor" contenteditable="true" data-placeholder="Пиши…"></div>

  <div class="controls">
    <img src="ui/erase.png" class="action-icon" id="clear-btn" onerror="this.style.display='none'">
    <img src="ui/download.png" class="action-icon" id="download-btn" onerror="this.style.display='none'">
  </div>

  <script>
    // === Аудио ===
    const soundTyping = document.getElementById('sound-typing');
    const soundErase = document.getElementById('sound-erase');
    const soundDownload = document.getElementById('sound-download');
    const soundLang = document.getElementById('sound-lang');

    function playSound(audioEl) {
      audioEl.currentTime = 0;
      audioEl.play().catch(e => {});
    }

    // === Редактор ===
    const editor = document.getElementById('editor');
    const translations = { ru: 'Пиши…', en: 'Typing…' };
    let currentLang = 'ru';

    const saved = localStorage.getItem('blokknote-html');
    if (saved) editor.innerHTML = saved;
    editor.setAttribute('data-placeholder', translations[currentLang]);

    editor.addEventListener('input', () => {
      localStorage.setItem('blokknote-html', editor.innerHTML);
      playSound(soundTyping);
    });

    // === Форматирование ===
    function exec(cmd, value = null) {
      document.execCommand(cmd, false, value);
      editor.focus();
    }

    document.getElementById('btn-bold').onclick = () => exec('bold');
    document.getElementById('btn-italic').onclick = () => exec('italic');
    document.getElementById('btn-underline').onclick = () => exec('underline');

    // h3 с переключением
    document.getElementById('btn-heading').onclick = () => {
      const selection = window.getSelection();
      if (selection.rangeCount === 0) return;

      const container = selection.getRangeAt(0).commonAncestorContainer;
      const inHeading = container.nodeType === 1 
        ? container.closest('h3') 
        : container.parentElement?.closest('h3');

      if (inHeading) {
        document.execCommand('formatBlock', false, '<p>');
      } else {
        document.execCommand('formatBlock', false, '<h3>');
      }
      editor.focus();
    };

    document.getElementById('btn-list').onclick = () => exec('insertUnorderedList');

    // === Язык ===
    function setLang(lang) {
      currentLang = lang;
      editor.setAttribute('data-placeholder', translations[lang]);
      document.getElementById('lang-ru').classList.toggle('active', lang === 'ru');
      document.getElementById('lang-en').classList.toggle('active', lang === 'en');
      playSound(soundLang);
    }
    document.getElementById('lang-ru').onclick = () => setLang('ru');
    document.getElementById('lang-en').onclick = () => setLang('en');

    // === Очистка ===
    document.getElementById('clear-btn').onclick = () => {
      editor.innerHTML = '';
      localStorage.removeItem('blokknote-html');
      editor.setAttribute('data-placeholder', translations[currentLang]);
      playSound(soundErase);
    };

    // === Скачивание как .doc (HTML внутри) + звук ===
    document.getElementById('download-btn').onclick = () => {
      const innerHtml = editor.innerHTML || '<p></p>';
      const html = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="utf-8">
          <title>blokknote</title>
        </head>
        <body>
          ${innerHtml}
        </body>
        </html>
      `;

      const blob = new Blob([html], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'blokknote.doc';
      a.click();
      URL.revokeObjectURL(url);
      playSound(soundDownload); // ✅ звук при скачивании
    };
  </script>
</body>
</html>
