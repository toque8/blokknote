<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Blokknote</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #f9f9f7;
      color: black;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .top-bar > div:first-child,
    .top-bar > div:last-child {
      width: 120px;
      display: flex;
      justify-content: flex-start;
    }
    .top-bar > div:last-child {
      justify-content: flex-end;
    }
    .top-bar > div:nth-child(2) {
      flex: 1;
      display: flex;
      justify-content: center;
    }
    .pencil-icon { height: 53px; opacity: 0.8; }
    .format-tools {
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .format-tools span {
      cursor: pointer;
      opacity: 0.7;
      user-select: none;
    }
    .format-tools span:hover { opacity: 1; }
    .lang-switch {
      font-size: 16px;
      display: flex;
      gap: 6px;
    }
    .lang-switch span {
      cursor: pointer;
      opacity: 0.5;
      user-select: none;
    }
    .lang-switch span.active { opacity: 1; }
    .underline-hint {
      border-bottom: 2px solid currentColor;
      padding-bottom: 2px;
      display: inline-block;
    }
    #editor {
      flex: 1;
      padding: 24px;
      background: transparent;
      color: black;
      border: none;
      outline: none;
      font-size: 17px;
      line-height: 1.6;
      font-family: inherit;
      min-height: 200px;
      overflow-y: auto;
    }
    #editor:focus { outline: none; }
    #editor:empty::before {
      content: attr(data-placeholder);
      color: #999;
      opacity: 0.6;
    }
    .controls {
      padding: 18px 20px;
      display: flex;
      justify-content: center;
      gap: 44px;
      flex-shrink: 0;
    }
    .action-icon {
      height: 42px;
      cursor: pointer;
      opacity: 0.7;
    }
    .action-icon:hover {
      opacity: 1;
    }
    .cancel-btn {
      position: absolute;
      bottom: 18px;
      left: 20px;
      height: 38px; /* ещё меньше, чем action-icon */
      cursor: pointer;
      opacity: 0.7;
    }
    .cancel-btn:hover {
      opacity: 1;
    }

    @media (max-width: 500px) {
      .top-bar { padding: 14px 16px; }
      .pencil-icon { height: 44px; }
      .format-tools { font-size: 15px; gap: 10px; }
      #editor { padding: 20px 16px; font-size: 16px; }
      .controls { padding: 16px; gap: 36px; }
      .action-icon { height: 35px; }
      .cancel-btn { bottom: 16px; left: 16px; height: 32px; }
    }

    @media (max-width: 360px) {
      .top-bar { padding: 12px 12px; }
      .format-tools { gap: 8px; }
      #editor { padding: 18px 12px; font-size: 15px; }
      .controls { gap: 32px; padding: 14px 12px; }
      .cancel-btn { bottom: 14px; left: 12px; }
    }

    @supports (padding-top: env(safe-area-inset-top)) {
      .top-bar {
        padding-top: calc(16px + env(safe-area-inset-top));
      }
      .controls {
        padding-bottom: calc(18px + env(safe-area-inset-bottom));
      }
      .cancel-btn {
        bottom: calc(18px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>

  <audio id="sound-typing" src="audio/typing.mp3" preload="auto"></audio>
  <audio id="sound-erase" src="audio/erase.mp3" preload="auto"></audio>
  <audio id="sound-download" src="audio/download.mp3" preload="auto"></audio>
  <audio id="sound-lang" src="audio/lang.mp3" preload="auto"></audio>

  <div class="top-bar">
    <div>
      <img src="ui/pencil.png" class="pencil-icon" alt="" onerror="this.style.display='none'">
    </div>
    <div class="format-tools">
      <span id="btn-bold"><b>e</b></span>
      <span id="btn-italic"><i>f</i></span>
      <span id="btn-underline" class="underline-hint">g</span>
      <span id="btn-heading">h3</span>
      <span id="btn-list">i-j-k</span>
    </div>
    <div>
      <button id="typing-test-btn" style="background:none;border:none;cursor:pointer;padding:0;margin-right:12px;height:20px;display:inline-flex;align-items:center;">
        <img src="ui/hourglass.png" alt="" onerror="this.style.display='none'" style="height:20px;opacity:0.7;">
      </button>
      <div class="lang-switch">
        <span id="lang-ru" class="active">RU</span>
        <span id="lang-en">EN</span>
      </div>
    </div>
  </div>

  <div id="editor" contenteditable="true" data-placeholder="Пиши…"></div>

  <div class="controls">
    <img src="ui/erase.png" class="action-icon" id="clear-btn" onerror="this.style.display='none'">
    <img src="ui/download.png" class="action-icon" id="download-btn" onerror="this.style.display='none'">
    <img src="ui/share.png" class="action-icon" id="share-btn" onerror="this.style.display='none'">
  </div>

  <img src="ui/cancel.png" class="cancel-btn" id="cancel-btn" onerror="this.style.display='none'">

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('from') === 'test') {
      const sound = new Audio('audio/lang.mp3');
      sound.play().catch(() => {});
    }

    const editor = document.getElementById('editor');
    const translations = { ru: 'Пиши…', en: 'Typing…' };
    let currentLang = 'ru';
    let history = [];

    const saved = localStorage.getItem('blokknote-html');
    if (saved) {
      editor.innerHTML = saved;
      history.push(saved);
    }
    editor.setAttribute('data-placeholder', translations[currentLang]);

    function saveState() {
      history.push(editor.innerHTML);
    }

    editor.addEventListener('input', () => {
      saveState();
      localStorage.setItem('blokknote-html', editor.innerHTML);
      const sound = new Audio('audio/typing.mp3');
      sound.play().catch(() => {});
    });

    function exec(cmd, value = null) {
      saveState();
      document.execCommand(cmd, false, value);
      editor.focus();
    }

    document.getElementById('btn-bold').onclick = () => exec('bold');
    document.getElementById('btn-italic').onclick = () => exec('italic');
    document.getElementById('btn-underline').onclick = () => exec('underline');

    document.getElementById('btn-heading').onclick = () => {
      const sel = window.getSelection();
      if (sel.rangeCount === 0) return;
      const container = sel.getRangeAt(0).commonAncestorContainer;
      const inHeading = container.nodeType === 1 ? container.closest('h3') : container.parentElement?.closest('h3');
      if (inHeading) {
        exec('formatBlock', '<p>');
      } else {
        exec('formatBlock', '<h3>');
      }
    };

    document.getElementById('btn-list').onclick = () => exec('insertUnorderedList');

    function setLang(lang) {
      currentLang = lang;
      editor.setAttribute('data-placeholder', translations[lang]);
      document.getElementById('lang-ru').classList.toggle('active', lang === 'ru');
      document.getElementById('lang-en').classList.toggle('active', lang === 'en');
      const sound = new Audio('audio/lang.mp3');
      sound.play().catch(() => {});
    }
    document.getElementById('lang-ru').onclick = () => setLang('ru');
    document.getElementById('lang-en').onclick = () => setLang('en');

    document.getElementById('clear-btn').onclick = () => {
      saveState();
      editor.innerHTML = '';
      localStorage.removeItem('blokknote-html');
      editor.setAttribute('data-placeholder', translations[currentLang]);
      const sound = new Audio('audio/erase.mp3');
      sound.play().catch(() => {});
    };

    document.getElementById('download-btn').onclick = () => {
      const html = editor.innerHTML || '<p></p>';
      const blob = new Blob([`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Blokknote</title></head><body>${html}</body></html>`], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'blokknote.doc';
      a.click();
      URL.revokeObjectURL(url);
      const sound = new Audio('audio/download.mp3');
      sound.play().catch(() => {});
    };

    document.getElementById('share-btn').onclick = async () => {
      const content = editor.innerHTML;

      if (!content.trim()) {
        alert('Добавьте текст');
        return;
      }

      const btn = document.getElementById('share-btn');
      btn.style.opacity = '0.5';

      try {
      const res = await fetch('/api/share', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                content: content
            })
        });

      const data = await res.json();

      if (res.ok) {
      const fullUrl = window.location.origin + data.url;
      window.open(fullUrl, '_blank');
        } else {
            alert('Ошибка: ' + (data.error || res.status));
        }
      } catch {
        alert('Ошибка сети');
      }

      btn.style.opacity = '1';
    };

    document.getElementById('cancel-btn').onclick = () => {
      if (history.length <= 1) {
        editor.innerHTML = '';
        localStorage.removeItem('blokknote-html');
        editor.setAttribute('data-placeholder', translations[currentLang]);
      } else {
        history.pop();
        const prevState = history[history.length - 1];
        editor.innerHTML = prevState || '';
        localStorage.setItem('blokknote-html', editor.innerHTML);
      }
      const sound = new Audio('audio/erase.mp3');
      sound.play().catch(() => {});
    };

    document.getElementById('typing-test-btn').onclick = (e) => {
      e.preventDefault();
      window.location.href = 'typing-test.html';
    };
  </script>
</body>
</html>
